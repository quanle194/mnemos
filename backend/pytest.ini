[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: requires PostgreSQL+pgvector and Redis (make test-db)
    real_provider: calls a real LLM/embedding provider (opt-in)
addopts = -ra --strict-markers -m "not real_provider"
filterwarnings =
    ignore::DeprecationWarning
