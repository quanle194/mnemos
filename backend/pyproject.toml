[project]
name = "mnemos"
version = "0.1.0"
description = "Mnemos AI memory ecosystem - API, worker and CLI"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "redis>=5.2",
  "httpx>=0.28",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "typer>=0.15",
  "uuid-utils>=0.10",
  "numpy>=2.1",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
  "mnemos-sdk",
]

[project.scripts]
mnemos = "app.cli:main"

[tool.uv.sources]
mnemos-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
