[project]
name = "mnemos-evals"
version = "0.1.0"
description = "Mnemos learning evals (Run A -> learn -> Run B)"
requires-python = ">=3.13"
dependencies = ["mnemos-sdk"]

[project.scripts]
mnemos-eval = "mnemos_evals.runner:main"

[tool.uv.sources]
mnemos-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mnemos_evals"]
