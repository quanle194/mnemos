[project]
name = "mnemos-workspace"
version = "0.1.0"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["backend", "sdk/python", "mcp-server", "evals"]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "mypy>=1.15",
  "respx>=0.22",
  "types-redis",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "PT"]
ignore = ["S101", "B008", "RUF012", "S311", "PT011"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108", "S603", "S607"]
"evals/**" = ["S603", "S607"]
