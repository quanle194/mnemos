[project]
name = "mnemos-workspace"
version = "0.1.0"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["backend", "sdk/python", "mcp-server", "evals"]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "mypy>=1.15",
  "respx>=0.22",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "PT"]
ignore = ["S101", "B008", "RUF012", "S311", "PT011"]

[tool.ruff.lint.isort]
known-first-party = ["app", "mnemos_sdk", "mnemos_mcp", "mnemos_evals", "tests"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108", "S603", "S607", "PT018", "E501"]
"**/alembic/versions/**" = ["E501"]
"evals/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = ["tests/", "alembic/versions/"]

[[tool.mypy.overrides]]
module = ["app.api.routers.*"]
disallow_untyped_defs = false
